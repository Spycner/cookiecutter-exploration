name: '{{ cookiecutter.project_slug }}'
version: '1.0.0'
config-version: 2

profile: '{{ cookiecutter.project_slug }}'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  +schema: "{{ cookiecutter.domain }}_workbench"
  +post-hook:
    - "{{ some_package.some_posthook(model) }}"
    - "{{ some_package.some_other_posthook(model) }}"
